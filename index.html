<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Show Scoring</title><style>
:root{--n:#0f172a;--b:#2563eb;--a:#f59e0b;--g:#059669;--r:#dc2626;--bg:#f1f5f9;--line:#cbd5e1}*{box-sizing:border-box}body{margin:0;font:16px Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--n)}button,input,select,textarea{font:inherit}header{background:var(--n);color:#fff;padding:14px}.wrap{max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}h1{margin:0}.scores{display:flex;gap:10px;flex-wrap:wrap}.team{min-width:210px;padding:10px 14px;border-radius:15px}.team.a{background:var(--b)}.team.b{background:var(--a);color:#111}.team input{border:0;background:transparent;color:inherit;font-weight:800;width:100%;outline:0}.score{font-size:36px;font-weight:900}.scoreline{display:flex;justify-content:space-between;align-items:center}.mini button{padding:3px 7px;background:#fff3;color:inherit;border:1px solid #fff6}main{padding:14px}.toolbar,.card{background:#fff;border-radius:16px;box-shadow:0 2px 9px #0f172a15}.toolbar{padding:11px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}button,.file{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;background:var(--n);color:#fff}.outline{background:#fff;color:var(--n);border:1px solid var(--line)}.good{background:var(--g)}.bad,.danger{background:var(--r)}.fix{background:#7c3aed;font-size:26px;padding:18px;width:100%}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.tab{background:#fff;color:var(--n);padding:15px}.tab.active{background:var(--n);color:#fff}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:12px}.card{padding:17px}.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.qnum{font-size:30px;font-weight:900;background:#dbeafe;color:#1e3a8a;border-radius:12px;padding:9px 14px}.result{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border:2px solid #bfdbfe;background:#eff6ff;border-radius:12px;margin:8px 0}.result.b{border-color:#fde68a;background:#fffbeb}.buttons{display:flex;gap:7px;flex-wrap:wrap}.full{width:100%}.boardLayout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.cat{display:flex;flex-direction:column;gap:7px}.catname{min-height:68px;padding:7px;background:var(--n);color:#fff;border-radius:10px;font-size:12px;font-weight:900;text-align:center;display:flex;align-items:center;justify-content:center}.tile{height:60px;background:var(--b);font-size:21px}.used{background:#e2e8f0;color:#64748b}.box{background:#dbeafe;color:#1e3a8a;padding:11px;border-radius:10px;font-weight:800;margin:9px 0}.muted{color:#64748b;font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:800}.qual{display:grid;gap:8px}.config{display:grid;grid-template-columns:1.3fr .5fr 2fr;gap:7px;align-items:center}.ch{background:#e2e8f0;padding:8px;font-weight:900}.vals{display:flex;gap:5px;flex-wrap:wrap}.vals input{width:70px;padding:7px;border:1px solid var(--line);border-radius:7px}.config select{padding:7px}.note{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.note textarea{width:100%;min-height:70px;padding:8px;border:1px solid var(--line);border-radius:8px}dialog{border:0;border-radius:15px;width:min(950px,calc(100% - 24px));max-height:88vh;padding:0}dialog::backdrop{background:#0f172aaa}.dh{position:sticky;top:0;background:#fff;padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.db{padding:14px}.toast{position:fixed;right:16px;bottom:16px;background:var(--n);color:#fff;padding:11px;border-radius:9px;display:none}@media(max-width:950px){.grid,.boardLayout{grid-template-columns:1fr}.board{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.tabs{grid-template-columns:1fr 1fr}.board{grid-template-columns:1fr 1fr}.config{grid-template-columns:1fr}.scores{width:100%}.team{flex:1;min-width:145px}}
</style></head><body><header><div class="wrap head"><h1>Game Show Scoring</h1><div class="scores"><div class="team a"><input id="na" value="Team A"><div class="scoreline"><span id="sa" class="score">0</span><span class="mini"><button data-adjust="a" data-d="-5">−5</button> <button data-adjust="a" data-d="5">+5</button></span></div></div><div class="team b"><input id="nb" value="Team B"><div class="scoreline"><span id="sb" class="score">0</span><span class="mini"><button data-adjust="b" data-d="-5">−5</button> <button data-adjust="b" data-d="5">+5</button></span></div></div></div></div></header>
<main class="wrap"><div class="toolbar"><div><label><b>Show</b> <select id="show"></select></label> <b id="leader">Tie game</b> <span class="badge" id="count">0 results</span><div class="muted" id="saved"></div></div><div class="actions"><button id="setup" class="outline">Season Setup</button><button id="undo" class="outline">Undo</button><button id="logbtn" class="outline">Question Log</button><button id="notesbtn" class="outline">Edit Notes</button><button id="csv" class="outline">Export CSV</button><button id="saveall">Save All Shows</button><label class="file outline">Load All Shows<input id="loadall" type="file" accept="application/json" hidden></label><button id="reset" class="danger">Reset Episode</button></div></div>
<nav class="tabs"><button class="tab active" data-round="r1">Challenge Round</button><button class="tab" data-round="r2">Lightning Round 1</button><button class="tab" data-round="r3">Capitalization Round</button><button class="tab" data-round="r4">Lightning Round 2</button></nav><section id="r1" class="panel active"></section><section id="r2" class="panel"></section><section id="r3" class="panel"></section><section id="r4" class="panel"></section></main>
<dialog id="notes"><div class="dh"><h2>Edit Notes</h2><button class="outline" data-close="notes">Close</button></div><div class="db" id="notelist"></div></dialog><dialog id="logs"><div class="dh"><h2>Question Log</h2><button class="outline" data-close="logs">Close</button></div><div class="db" id="loglist"></div></dialog><dialog id="season"><div class="dh"><div><h2>Season Setup</h2><div class="muted">Each show has its own Capitalization Round setup.</div></div><button class="outline" data-close="season">Close</button></div><div class="db"><div class="toolbar"><label><b>Configure Show</b> <select id="setshow"></select></label><button id="copy" class="outline">Copy Previous Show</button></div><div id="config"></div></div></dialog><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';const C=['Arts & Entertainment','World Events','Literature','Social Studies','Math & Science','General Knowledge'],V=[30,25,20,15],key=(c,v)=>c+'::'+v,$=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const config=()=>({tiles:Object.fromEntries(C.flatMap(c=>V.map(v=>[key(c,v),[v]])))}),r3=()=>({stage:'pick',tile:null,team:null,current:1,values:[],results:[]}),episode=()=>({teams:{a:{name:'Team A',score:0},b:{name:'Team B',score:0}},round:'r1',nums:{r1:1,r2:1,r4:1},r1:{stage:'idle',first:null},r3:r3(),used:[],logs:[],fixes:[],history:[]}),fresh=()=>({current:1,configs:Object.fromEntries(Array.from({length:30},(_,i)=>[i+1,config()])),shows:Object.fromEntries(Array.from({length:30},(_,i)=>[i+1,episode()]))});let app=load()||fresh();for(let i=1;i<=30;i++){app.shows[i]??=episode();app.configs[i]??=config()}let s=app.shows[app.current];
function load(){try{return JSON.parse(localStorage.getItem('gameshow.v3'))}catch{return null}}function save(){app.shows[app.current]=s;localStorage.setItem('gameshow.v3',JSON.stringify(app));$('#saved').textContent='Show '+app.current+' saved locally'}function snap(){let x=JSON.parse(JSON.stringify(s));x.history=[];return x}function cp(){s.history.push(snap());if(s.history.length>80)s.history.shift()}function tn(i){return s.teams[i].name}function other(i){return i==='a'?'b':'a'}function score(i,d){s.teams[i].score+=d}function toast(t){let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1600)}function addlog(round,q,result,changes=[]){s.logs.unshift({round,q,result,changes})}
function roundName(r){return({r1:'Challenge Round',r2:'Lightning Round 1',r3:'Capitalization Round',r4:'Lightning Round 2'})[r]}function fixContext(r){if(r!=='r3')return{round:roundName(r),q:'Question '+s.nums[r]+' of 30'};let x=s.r3;if(x.tile&&x.stage==='category')return{round:'Capitalization Round',q:x.tile.category+' '+x.tile.value+', Category Question '+x.current};if(x.tile)return{round:'Capitalization Round',q:x.tile.category+' '+x.tile.value+', Qualifying Question'};return{round:'Capitalization Round',q:'Gameboard'}}function addFix(r){let c=fixContext(r);s.fixes.unshift({id:crypto.randomUUID(),show:app.current,round:c.round,q:c.q,reason:''});save();toast('FIX added to Edit Notes')}
function render(){s=app.shows[app.current];$('#show').value=app.current;$('#na').value=tn('a');$('#nb').value=tn('b');$('#sa').textContent=s.teams.a.score;$('#sb').textContent=s.teams.b.score;$('#leader').textContent=s.teams.a.score===s.teams.b.score?'Tie game':tn(s.teams.a.score>s.teams.b.score?'a':'b')+' leads';$('#count').textContent=s.logs.length+' results';$('#undo').disabled=!s.history.length;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.round===s.round));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===s.round));rr1();rl('r2');rr3();rl('r4');save()}
function shell(r,title,body){return`<div class="grid"><div class="card"><div class="qhead"><h2>${title}</h2><span class="qnum">Question ${s.nums[r]} of 30</span></div><button class="fix" data-fix="${r}">FIX</button><p class="muted">Flags this round and question for later entry in Edit Notes.</p></div><div class="card"><h2>Record Result</h2>${body}</div></div>`}function tc(i,ra,wa){return`<div class="result ${i==='b'?'b':''}"><b>${E(tn(i))}</b><div class="buttons"><button class="good" data-act="${ra}">Correct</button><button class="bad" data-act="${wa}">Incorrect</button></div></div>`}
function rr1(){let b=s.r1.stage==='idle'?`<b>Which team buzzed first?</b>${tc('a','r1-a-ok','r1-a-no')}${tc('b','r1-b-ok','r1-b-no')}<button class="outline full" data-act="r1-none">Nobody buzzed</button>`:`<div class="box">Second chance: ${E(tn(other(s.r1.first)))}</div><button class="good" data-act="r1-steal-ok">Correct +10</button> <button class="bad" data-act="r1-steal-no">Incorrect</button>`;$('#r1').innerHTML=shell('r1','Challenge Round',b)}function rl(r){$('#'+r).innerHTML=shell(r,roundName(r),tc('a',r+'-a-ok',r+'-a-no')+tc('b',r+'-b-ok',r+'-b-no')+`<button class="outline full" data-act="${r}-none">No answer / no buzz</button>`)}
function rr3(){let x=s.r3,board=C.map(c=>`<div class="cat"><div class="catname">${E(c)}</div>${V.map(v=>{let k=key(c,v),u=s.used.includes(k);return`<button class="tile ${u?'used':''}" ${u||x.tile?'disabled':''} data-tile="${E(c)}" data-v="${v}">${u?'✓':v}</button>`}).join('')}</div>`).join(''),ctl='<div class="box">Select a category and point value.</div>';if(x.tile){ctl=`<div class="box">${E(x.tile.category)} · ${x.tile.value}</div>`;if(x.stage==='qualifier')ctl+=`<h3>Who answered the qualifying question correctly?</h3><div class="qual"><button class="good" data-act="qual-a">${E(tn('a'))}</button><button class="good" data-act="qual-b">${E(tn('b'))}</button><button class="bad" data-act="qual-none">Neither team</button></div>`;if(x.stage==='category'){let v=x.values[x.current-1];ctl+=`<h3>Category Question ${x.current} of ${x.values.length}</h3><div class="box">${E(tn(x.team))} · ${v} points</div><button class="good" data-act="cat-ok">Correct +${v}</button> <button class="bad" data-act="cat-no">Incorrect +0</button>`}}$('#r3').innerHTML=`<div class="boardLayout"><div class="card"><div class="qhead"><h2>Capitalization Round · Show ${app.current}</h2><button class="fix" style="width:auto;font-size:20px;padding:12px" data-fix="r3">FIX</button></div><div class="board">${board}</div></div><div class="card"><h2>Control</h2>${ctl}</div></div>`}
function finish(r,result,changes=[]){cp();changes.forEach(x=>score(x.team,x.delta));addlog(roundName(r),s.nums[r],result,changes);s.nums[r]=Math.min(30,s.nums[r]+1);if(r==='r1')s.r1={stage:'idle',first:null};render()}function finish3(result,changes=[]){cp();changes.forEach(x=>score(x.team,x.delta));let x=s.r3;s.used.push(key(x.tile.category,x.tile.value));addlog('Capitalization Round',x.tile.category+' '+x.tile.value,result,changes);s.r3=r3();render()}
document.addEventListener('click',e=>{let t=e.target.closest('[data-round]');if(t){s.round=t.dataset.round;render();return}let f=e.target.closest('[data-fix]');if(f){addFix(f.dataset.fix);return}let ad=e.target.closest('[data-adjust]');if(ad){cp();score(ad.dataset.adjust,+ad.dataset.d);addlog('Manual adjustment','-',tn(ad.dataset.adjust)+' '+ad.dataset.d,[{team:ad.dataset.adjust,delta:+ad.dataset.d}]);render();return}let tile=e.target.closest('[data-tile]');if(tile){cp();let c=tile.dataset.tile,v=+tile.dataset.v;s.r3={stage:'qualifier',tile:{category:c,value:v},team:null,current:1,values:[...(app.configs[app.current].tiles[key(c,v)]||[v])],results:[]};render();return}let a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;if(a==='r1-none')finish('r1','Nobody buzzed');else if(/^r1-[ab]-ok$/.test(a)){let i=a.split('-')[1];finish('r1',tn(i)+' correct',[{team:i,delta:10}])}else if(/^r1-[ab]-no$/.test(a)){s.r1={stage:'second',first:a.split('-')[1]};render()}else if(a==='r1-steal-ok'){let i=other(s.r1.first);finish('r1',tn(i)+' correct on second chance',[{team:i,delta:10}])}else if(a==='r1-steal-no')finish('r1','Both teams incorrect');else if(/^r[24]-[ab]-(ok|no)$/.test(a)){let [r,i,z]=a.split('-'),d=z==='ok'?5:-5;finish(r,tn(i)+' '+(z==='ok'?'correct':'incorrect'),[{team:i,delta:d}])}else if(/^r[24]-none$/.test(a))finish(a.slice(0,2),'No answer / no buzz');else if(a==='qual-a'||a==='qual-b'){s.r3.team=a.slice(-1);s.r3.stage='category';render()}else if(a==='qual-none')finish3('Neither team qualified');else if(a==='cat-ok'||a==='cat-no'){let x=s.r3,ok=a==='cat-ok',v=x.values[x.current-1];x.results.push({q:x.current,correct:ok,value:v});if(x.current===x.values.length){let pts=x.results.filter(y=>y.correct).reduce((n,y)=>n+y.value,0);finish3(tn(x.team)+' earned '+pts+' points',pts?[{team:x.team,delta:pts}]:[])}else{x.current++;render()}}});
['a','b'].forEach(i=>$('#n'+i).oninput=e=>{s.teams[i].name=e.target.value;save()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());$('#show').onchange=e=>{save();app.current=+e.target.value;s=app.shows[app.current];render();toast('Show '+app.current+' loaded')};$('#undo').onclick=()=>{if(!s.history.length)return;let h=s.history,p=h.pop();s={...p,history:h};app.shows[app.current]=s;render()};
function showNotes(){let n=$('#notelist');n.innerHTML=s.fixes.length?s.fixes.map(x=>`<div class="note"><b>Show ${x.show} · ${E(x.round)} · ${E(x.q)}</b><textarea data-reason="${x.id}" placeholder="Enter the reason for this fix...">${E(x.reason)}</textarea><button class="bad" data-del-fix="${x.id}">Delete</button></div>`).join(''):'<p>No FIX entries for this episode.</p>';$('#notes').showModal()}$('#notesbtn').onclick=showNotes;$('#notelist').oninput=e=>{if(e.target.matches('[data-reason]')){let x=s.fixes.find(y=>y.id===e.target.dataset.reason);if(x)x.reason=e.target.value;save()}};$('#notelist').onclick=e=>{let b=e.target.closest('[data-del-fix]');if(b&&confirm('Delete this Edit Notes entry?')){s.fixes=s.fixes.filter(x=>x.id!==b.dataset.delFix);showNotes();save()}};
$('#logbtn').onclick=()=>{$('#loglist').innerHTML=s.logs.length?s.logs.map(x=>`<div class="note"><b>${E(x.round)} · ${E(x.q)}</b><div>${E(x.result)}</div></div>`).join(''):'<p>No results.</p>';$('#logs').showModal()};
function renderConfig(){let sh=+$('#setshow').value,cfg=app.configs[sh],h='<div class="config"><div class="ch">Board tile</div><div class="ch">#</div><div class="ch">Question values</div>';for(let c of C)for(let v of V){let k=key(c,v),vs=cfg.tiles[k];h+=`<b>${E(c)} ${v}</b><select data-cc="${E(k)}">${[1,2,3,4,5].map(n=>`<option ${n===vs.length?'selected':''}>${n}</option>`).join('')}</select><span class="vals">${vs.map((x,i)=>`<label>Q${i+1}<input type="number" min="0" step="5" value="${x}" data-cv="${E(k)}" data-i="${i}"></label>`).join('')}</span>`}$('#config').innerHTML=h+'</div>'}$('#setup').onclick=()=>{$('#setshow').value=app.current;renderConfig();$('#season').showModal()};$('#setshow').onchange=renderConfig;$('#config').onchange=e=>{let sh=+$('#setshow').value,c=app.configs[sh];if(e.target.matches('[data-cc]')){let k=e.target.dataset.cc,n=+e.target.value,old=c.tiles[k];c.tiles[k]=Array.from({length:n},(_,i)=>old[i]??10);renderConfig()}if(e.target.matches('[data-cv]'))c.tiles[e.target.dataset.cv][+e.target.dataset.i]=Math.max(0,+e.target.value||0);save()};$('#copy').onclick=()=>{let sh=+$('#setshow').value;if(sh===1)return alert('Show 1 has no previous show.');app.configs[sh]=JSON.parse(JSON.stringify(app.configs[sh-1]));renderConfig();save()};
$('#reset').onclick=()=>{if(confirm('Reset Show '+app.current+' to its default state? This clears its teams, scores, progress, logs, and Edit Notes. Season Setup is preserved.')){s=episode();app.shows[app.current]=s;render();toast('Show '+app.current+' reset')}};function dl(n,t,y){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:y}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}$('#saveall').onclick=()=>{save();dl('game-show-all-30-shows.json',JSON.stringify(app,null,2),'application/json')};$('#loadall').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.shows||!x.configs)throw 0;app=x;s=app.shows[app.current];render()}catch{alert('Invalid all-shows backup.')}e.target.value=''};$('#csv').onclick=()=>{
  let q=v=>'"'+String(v??'').replaceAll('"','""')+'"';
  let normalize=v=>String(v??'').replace(/^Question\s+/i,'').replace(/\s+of\s+30$/i,'').trim();
  let notesFor=log=>s.fixes.filter(f=>f.round===log.round&&(normalize(f.q)===normalize(log.q)||normalize(f.q).startsWith(normalize(log.q)+','))).map(f=>f.reason.trim()||'[Reason not entered]').join(' | ');
  let matched=new Set(),totalA=0,totalB=0;
  let rows=[['Show','Round','Question','Result','Score changes','Team A name','Team A total','Team B name','Team B total','Edit Notes']];
  for(let log of [...s.logs].reverse()){
    for(let change of log.changes||[]){if(change.team==='a')totalA+=change.delta;if(change.team==='b')totalB+=change.delta}
    let notes=notesFor(log);
    s.fixes.forEach(f=>{if(f.round===log.round&&(normalize(f.q)===normalize(log.q)||normalize(f.q).startsWith(normalize(log.q)+',')))matched.add(f.id)});
    rows.push([app.current,log.round,log.q,log.result,(log.changes||[]).map(c=>tn(c.team)+' '+(c.delta>=0?'+':'')+c.delta).join('; '),tn('a'),totalA,tn('b'),totalB,notes]);
  }
  for(let fix of [...s.fixes].reverse())if(!matched.has(fix.id))rows.push([app.current,fix.round,fix.q,'FIX note only','',tn('a'),totalA,tn('b'),totalB,fix.reason.trim()||'[Reason not entered]']);
  dl('show-'+app.current+'-question-log.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')
};
for(let i=1;i<=30;i++){$('#show').add(new Option(i,i));$('#setshow').add(new Option(i,i))}render();})();
</script></body></html>
