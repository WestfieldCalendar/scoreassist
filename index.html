<main class="wrap"><div class="toolbar"><div><label><b>Show</b> <select id="show"></select></label> <b id="leader">Tie game</b> <span class="badge" id="count">0 results</span><div class="muted" id="saved"></div></div><div class="actions"><button id="setup" class="outline tip" data-tip="Configure Capitalization Round question counts and point values for each show." aria-label="Season Setup. Configure Capitalization Round questions for each show.">Season Setup</button><button id="undo" class="outline tip" data-tip="Reverse the most recent scoring or game-progress action for the current show." aria-label="Undo the most recent action.">Undo</button><button id="logbtn" class="outline tip" data-tip="Review recorded results and score changes for the current show." aria-label="Open the current show question log.">Question Log</button><button id="notesbtn" class="outline tip" data-tip="Review, edit, or delete corrections entered with the FIX button." aria-label="Open Edit Notes.">Edit Notes</button><button id="csv" class="outline tip" data-tip="Download the current show’s question and scoring log as a CSV file." aria-label="Export the current show log as CSV.">Export CSV</button><button id="saveall" class="tip" data-tip="Download one JSON backup containing all 30 shows, setup, scripts, scores, logs, and progress." aria-label="Save all shows to a JSON backup.">Save All Shows</button><label class="file outline tip" data-tip="Load a saved all-shows JSON file and restore its data." aria-label="Load all shows from a JSON backup." tabindex="0">Load All Shows<input id="loadall" type="file" accept="application/json" hidden></label><button id="reset" class="danger tip" data-tip="Clear teams, scores, progress, logs, and Edit Notes for this show. Season Setup is preserved." aria-label="Reset the selected episode. Season Setup is preserved.">Reset Episode</button></div></div>

<script>
(()=>{'use strict';const C=['Arts & Entertainment','World Events','Literature','Social Studies','Math & Science','General Knowledge'],V=[30,25,20,15],key=(c,v)=>c+'::'+v,$=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const config=()=>({tiles:Object.fromEntries(C.flatMap(c=>V.map(v=>[key(c,v),[v]])))}),r3=()=>({stage:'pick',tile:null,team:null,current:1,values:[],results:[]}),episode=()=>({teams:{a:{name:'Team A',score:0},b:{name:'Team B',score:0}},round:'r1',nums:{r1:1,r2:1,r4:1},view:{r1:1,r2:1,r4:1},r1:{stage:'idle',first:null},r3:r3(),used:[],logs:[],fixes:[],history:[]}),fresh=()=>({current:2101,configs:Object.fromEntries(Array.from({length:30},(_,i)=>[2101+i,config()])),shows:Object.fromEntries(Array.from({length:30},(_,i)=>[2101+i,episode()])),questions:Object.fromEntries(Array.from({length:30},(_,i)=>[2101+i,{r1:[],r2:[],r3:{},r4:[]}]))});let app=load()||fresh();if(app.current>=1&&app.current<=30){let old=app;app=fresh();for(let i=1;i<=30;i++){app.shows[2100+i]=old.shows?.[i]||episode();app.configs[2100+i]=old.configs?.[i]||config()}app.current=2100+(old.current||1)}app.questions??={};for(let i=2101;i<=2130;i++){app.shows[i]??=episode();app.configs[i]??=config();app.questions[i]??={r1:[],r2:[],r3:{},r4:[]}}if(app.current<2101||app.current>2130)app.current=2101;let s=app.shows[app.current];
function load(){try{return JSON.parse(localStorage.getItem('gameshow.v3'))}catch{return null}}function save(){app.shows[app.current]=s;localStorage.setItem('gameshow.v3',JSON.stringify(app));$('#saved').textContent='Show '+app.current+' saved locally'}function snap(){let x=JSON.parse(JSON.stringify(s));x.history=[];return x}function cp(){s.history.push(snap());if(s.history.length>80)s.history.shift()}function tn(i){return s.teams[i].name}function other(i){return i==='a'?'b':'a'}function score(i,d){s.teams[i].score+=d}function toast(t){let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1600)}function addlog(round,q,result,changes=[]){s.logs.unshift({round,q,result,changes})}
function roundName(r){return({r1:'Challenge Round',r2:'Lightning Round 1',r3:'Capitalization Round',r4:'Lightning Round 2'})[r]}function fixContext(r){if(r!=='r3')return{round:roundName(r),q:'Question '+s.view[r]+' of 30'};let x=s.r3;if(x.tile&&x.stage==='category')return{round:'Capitalization Round',q:x.tile.category+' '+x.tile.value+', Category Question '+x.current};if(x.tile)return{round:'Capitalization Round',q:x.tile.category+' '+x.tile.value+', Qualifying Question'};return{round:'Capitalization Round',q:'Gameboard'}}let pendingFix=null;function addFix(r){let c=fixContext(r);pendingFix={id:crypto.randomUUID(),show:app.current,round:c.round,q:c.q,reason:''};$('#fixwhere').textContent='Show '+app.current+' · '+c.round+' · '+c.q;$('#fixreason').value='';$('#quickfix').showModal();setTimeout(()=>$('#fixreason').focus(),0)}function saveQuickFix(){if(!pendingFix)return;pendingFix.reason=$('#fixreason').value.trim();s.fixes.unshift(pendingFix);pendingFix=null;$('#quickfix').close();save();toast('FIX saved to Edit Notes')}
function render(){s=app.shows[app.current];s.view=s.view||{};for(const r of ['r1','r2','r4']){if(typeof s.view[r]!=='number')s.view[r]=s.nums[r];let loaded=app.questions?.[app.current]?.[r]?.length||30,max=Math.max(s.nums[r],loaded);s.view[r]=Math.max(1,Math.min(max,s.view[r]))}$('#show').value=app.current;$('#na').value=tn('a');$('#nb').value=tn('b');$('#sa').textContent=s.teams.a.score;$('#sb').textContent=s.teams.b.score;$('#leader').textContent=s.teams.a.score===s.teams.b.score?'Tie game':tn(s.teams.a.score>s.teams.b.score?'a':'b')+' leads';$('#count').textContent=s.logs.length+' results';$('#undo').disabled=!s.history.length;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.round===s.round));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===s.round));rr1();rl('r2');rr3();rl('r4');save()}
function qaCard(item,label='Current Question'){if(!item)return`<div class="qaempty">No question text is loaded for this position.</div>`;return`<div class="qa"><div class="qcard"><div class="qlabel">${E(label).toUpperCase()}</div><div class="qtext">${E(item.question)}</div></div><div class="acard"><div class="qlabel">ANSWER</div><div class="atext">${E(item.answer)}</div></div></div>`}function roundQuestion(r){return app.questions?.[app.current]?.[r]?.[s.view[r]-1]||null}function capQuestion(tile,part,index=0){let q=app.questions?.[app.current]?.r3?.[key(tile.category,tile.value)];return part==='qualifier'?q?.qualifier:q?.category?.[index]}
function shell(r,title,body){let live=s.view[r]===s.nums[r],loaded=app.questions?.[app.current]?.[r]?.length||30,max=Math.max(s.nums[r],loaded);let nav=`<div class="qheadnav"><button class="navbtn" data-navprev="${r}" ${s.view[r]<=1?'disabled':''} title="Previous question">‹</button><span class="qnum">Question ${s.view[r]} of ${loaded}</span><button class="navbtn" data-navnext="${r}" ${s.view[r]>=max?'disabled':''} title="Next question">›</button></div>`;let jump=live?'':`<p class="muted">Previewing question ${s.view[r]}. <button class="outline" data-navlive="${r}">Jump to current live question (Q${s.nums[r]})</button></p>`;let right=live?`<h2>Record Result</h2>${body}`:`<h2>Question Preview</h2><p class="muted">Use the arrows to review the loaded script. Scoring remains available only for the current live question.</p>`;return`<div class="grid"><div class="card"><div class="qhead"><h2>${title}</h2>${nav}</div>${jump}${qaCard(roundQuestion(r))}<button class="fix" data-fix="${r}">FIX</button><p class="muted">Opens a quick correction note for this question.</p></div><div class="card">${right}</div></div>`}function tc(i,ra,wa){return`<div class="result ${i==='b'?'b':''}"><b>${E(tn(i))}</b><div class="buttons"><button class="good" data-act="${ra}">Correct</button><button class="bad" data-act="${wa}">Incorrect</button></div></div>`}
function rr1(){let b=s.r1.stage==='idle'?`<b>Which team buzzed first?</b>${tc('a','r1-a-ok','r1-a-no')}${tc('b','r1-b-ok','r1-b-no')}<button class="outline full" data-act="r1-none">Nobody buzzed</button>`:`<div class="box">Capitalization: ${E(tn(other(s.r1.first)))}</div><button class="good" data-act="r1-steal-ok">Correct +10</button> <button class="bad" data-act="r1-steal-no">Incorrect</button>`;$('#r1').innerHTML=shell('r1','Challenge Round',b)}function rl(r){$('#'+r).innerHTML=shell(r,roundName(r),tc('a',r+'-a-ok',r+'-a-no')+tc('b',r+'-b-ok',r+'-b-no')+`<button class="outline full" data-act="${r}-none">No answer / no buzz</button>`)}
function rr3(){let x=s.r3,board=C.map(c=>`<div class="cat"><div class="catname">${E(c)}</div>${V.map(v=>{let k=key(c,v),u=s.used.includes(k);return`<button class="tile ${u?'used':''}" ${u||x.tile?'disabled':''} data-tile="${E(c)}" data-v="${v}">${u?'✓':v}</button>`}).join('')}</div>`).join('');if(!x.tile){$('#r3').innerHTML=`<div class="boardLayout"><div class="card"><div class="qhead"><h2>Capitalization Round · Show ${app.current}</h2><button class="fix" style="width:auto;font-size:20px;padding:12px" data-fix="r3">FIX</button></div><div class="board">${board}</div></div><div class="card"><h2>Control</h2><div class="box">Select a category and point value.</div><p class="muted">Used tiles remain checked and unavailable.</p></div></div>`;return}let label=x.stage==='qualifier'?'Qualifying Question':'Category Question '+x.current;let item=x.stage==='qualifier'?capQuestion(x.tile,'qualifier'):capQuestion(x.tile,'category',x.current-1);let progress=x.stage==='qualifier'?'Qualifier':`Question ${x.current} of ${x.values.length} · ${x.values[x.current-1]} points`;let controls=x.stage==='qualifier'?`<h2>Record Qualifier</h2><h3>Who answered correctly?</h3><div class="qual"><button class="good" data-act="qual-a">${E(tn('a'))}</button><button class="good" data-act="qual-b">${E(tn('b'))}</button><button class="bad" data-act="qual-none">Neither team</button></div>`:`<h2>Record Result</h2><div class="box">${E(tn(x.team))} · ${x.values[x.current-1]} points</div><button class="good" data-act="cat-ok">Correct +${x.values[x.current-1]}</button> <button class="bad" data-act="cat-no">Incorrect +0</button>`;$('#r3').innerHTML=`<div class="grid"><div class="card"><div class="qhead"><div><h2>Capitalization Round</h2><div class="badge">${E(x.tile.category)} · ${x.tile.value} · ${progress}</div></div></div>${qaCard(item,label)}<button class="fix" data-fix="r3">FIX</button><p class="muted">Opens a quick correction note for this question.</p></div><div class="card">${controls}</div></div>`}
function finish(r,result,changes=[]){cp();changes.forEach(x=>score(x.team,x.delta));addlog(roundName(r),s.nums[r],result,changes);s.nums[r]=Math.min(30,s.nums[r]+1);s.view[r]=s.nums[r];if(r==='r1')s.r1={stage:'idle',first:null};render()}function finish3(result){cp();let x=s.r3;s.used.push(key(x.tile.category,x.tile.value));addlog('Capitalization Round',x.tile.category+' '+x.tile.value,result,[]);s.r3=r3();render()}
document.addEventListener('click',e=>{let t=e.target.closest('[data-round]');if(t){s.round=t.dataset.round;render();return}let f=e.target.closest('[data-fix]');if(f){addFix(f.dataset.fix);return}let ad=e.target.closest('[data-adjust]');if(ad){let team=ad.dataset.adjust,delta=+ad.dataset.d;cp();score(team,delta);addlog('Manual Score Adjustment','Score controls',tn(team)+' '+(delta>0?'+':'')+delta+' points. New score: '+s.teams[team].score,[{team,delta}]);render();return}let np=e.target.closest('[data-navprev]');if(np){let r=np.dataset.navprev;s.view[r]=Math.max(1,s.view[r]-1);render();return}let nn=e.target.closest('[data-navnext]');if(nn){let r=nn.dataset.navnext,loaded=app.questions?.[app.current]?.[r]?.length||30,max=Math.max(s.nums[r],loaded);s.view[r]=Math.min(max,s.view[r]+1);render();return}let nl=e.target.closest('[data-navlive]');if(nl){let r=nl.dataset.navlive;s.view[r]=s.nums[r];render();return}let tile=e.target.closest('[data-tile]');if(tile){cp();let c=tile.dataset.tile,v=+tile.dataset.v;s.r3={stage:'qualifier',tile:{category:c,value:v},team:null,current:1,values:[...(app.configs[app.current].tiles[key(c,v)]||[v])],results:[]};render();return}let a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;if(a==='r1-none')finish('r1','Nobody buzzed');else if(/^r1-[ab]-ok$/.test(a)){let i=a.split('-')[1];finish('r1',tn(i)+' correct',[{team:i,delta:10}])}else if(/^r1-[ab]-no$/.test(a)){s.r1={stage:'second',first:a.split('-')[1]};render()}else if(a==='r1-steal-ok'){let i=other(s.r1.first);finish('r1',tn(i)+' correct on capitalization',[{team:i,delta:10}])}else if(a==='r1-steal-no')finish('r1','Both teams incorrect');else if(/^r[24]-[ab]-(ok|no)$/.test(a)){let [r,i,z]=a.split('-'),d=z==='ok'?5:-5;finish(r,tn(i)+' '+(z==='ok'?'correct':'incorrect'),[{team:i,delta:d}])}else if(/^r[24]-none$/.test(a))finish(a.slice(0,2),'No answer / no buzz');else if(a==='qual-a'||a==='qual-b'){s.r3.team=a.slice(-1);s.r3.stage='category';render()}else if(a==='qual-none')finish3('Neither team qualified');else if(a==='cat-ok'||a==='cat-no'){let x=s.r3,ok=a==='cat-ok',v=x.values[x.current-1],questionNumber=x.current,team=x.team;cp();if(ok)score(team,v);x.results.push({q:questionNumber,correct:ok,value:v});addlog('Capitalization Round',x.tile.category+' '+x.tile.value+', Category Question '+questionNumber,tn(team)+(ok?' correct +'+v:' incorrect +0'),ok?[{team,delta:v}]:[]);if(questionNumber===x.values.length){let pts=x.results.filter(y=>y.correct).reduce((total,y)=>total+y.value,0);s.used.push(key(x.tile.category,x.tile.value));addlog('Capitalization Round',x.tile.category+' '+x.tile.value,'Category complete. '+tn(team)+' earned '+pts+' points total.',[]);s.r3=r3()}else{x.current++}render()}});
['a','b'].forEach(i=>$('#n'+i).oninput=e=>{s.teams[i].name=e.target.value;save()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());$('#fixok').onclick=saveQuickFix;$('#fixreason').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveQuickFix()}});$('#quickfix').addEventListener('close',()=>{if(pendingFix&&!$('#fixreason').value.trim())pendingFix=null});$('#show').onchange=e=>{save();app.current=+e.target.value;s=app.shows[app.current];render();toast('Show '+app.current+' loaded')};$('#undo').onclick=()=>{if(!s.history.length)return;let h=s.history,p=h.pop();s={...p,history:h};app.shows[app.current]=s;render()};
function showNotes(){let n=$('#notelist');n.innerHTML=s.fixes.length?s.fixes.map(x=>`<div class="note"><b>Show ${x.show} · ${E(x.round)} · ${E(x.q)}</b><textarea data-reason="${x.id}" placeholder="Enter the reason for this fix...">${E(x.reason)}</textarea><button class="bad" data-del-fix="${x.id}">Delete</button></div>`).join(''):'<p>No FIX entries for this episode.</p>';$('#notes').showModal()}$('#notesbtn').onclick=showNotes;$('#notelist').oninput=e=>{if(e.target.matches('[data-reason]')){let x=s.fixes.find(y=>y.id===e.target.dataset.reason);if(x)x.reason=e.target.value;save()}};$('#notelist').onclick=e=>{let b=e.target.closest('[data-del-fix]');if(b&&confirm('Delete this Edit Notes entry?')){s.fixes=s.fixes.filter(x=>x.id!==b.dataset.delFix);showNotes();save()}};
$('#logbtn').onclick=()=>{$('#loglist').innerHTML=s.logs.length?s.logs.map(x=>`<div class="note"><b>${E(x.round)} · ${E(x.q)}</b><div>${E(x.result)}</div></div>`).join(''):'<p>No results.</p>';$('#logs').showModal()};
function renderConfig(){let sh=+$('#setshow').value,cfg=app.configs[sh],h='<div class="config"><div class="ch">Board tile</div><div class="ch">#</div><div class="ch">Question values</div>';for(let c of C)for(let v of V){let k=key(c,v),vs=cfg.tiles[k];h+=`<b>${E(c)} ${v}</b><select data-cc="${E(k)}">${[1,2,3,4,5].map(n=>`<option ${n===vs.length?'selected':''}>${n}</option>`).join('')}</select><span class="vals">${vs.map((x,i)=>`<label>Q${i+1}<input type="number" min="0" step="5" value="${x}" data-cv="${E(k)}" data-i="${i}"></label>`).join('')}</span>`}$('#config').innerHTML=h+'</div>'}$('#setup').onclick=()=>{$('#setshow').value=app.current;renderConfig();$('#season').showModal()};$('#setshow').onchange=renderConfig;$('#config').onchange=e=>{let sh=+$('#setshow').value,c=app.configs[sh];if(e.target.matches('[data-cc]')){let k=e.target.dataset.cc,n=+e.target.value,old=c.tiles[k];c.tiles[k]=Array.from({length:n},(_,i)=>old[i]??10);renderConfig()}if(e.target.matches('[data-cv]'))c.tiles[e.target.dataset.cv][+e.target.dataset.i]=Math.max(0,+e.target.value||0);save()};$('#copy').onclick=()=>{let sh=+$('#setshow').value;if(sh===2101)return alert('Show 2101 has no previous show.');app.configs[sh]=JSON.parse(JSON.stringify(app.configs[sh-1]));renderConfig();save()};
$('#reset').onclick=()=>{if(confirm('Reset Show '+app.current+' to its default state? This clears its teams, scores, progress, logs, and Edit Notes. Season Setup is preserved.')){s=episode();app.shows[app.current]=s;render();toast('Show '+app.current+' reset')}};function dl(n,t,y){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:y}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}$('#saveall').onclick=()=>{save();dl('game-show-all-30-shows.json',JSON.stringify(app,null,2),'application/json')};$('#loadall').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.shows||!x.configs)throw 0;app=x;s=app.shows[app.current];render()}catch{alert('Invalid all-shows backup.')}e.target.value=''};$('#csv').onclick=()=>{let q=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=[['Round','Question','Result','Score changes'],...[...s.logs].reverse().map(x=>[x.round,x.q,x.result,(x.changes||[]).map(c=>tn(c.team)+' '+c.delta).join('; ')])];dl('show-'+app.current+'-question-log.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')};
for(let i=2101;i<=2130;i++){$('#show').add(new Option(i,i));$('#setshow').add(new Option(i,i))}render();})();
